<!doctype html>
<!-- Play Store feature graphic, 1024×500. Open with ?lang=en for the English text. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../app/style.css">
  <style>
    html, body { width: 1024px; height: 500px; overflow: hidden; }
    body {
      margin: 0; display: grid; grid-template-columns: 1fr 380px; align-items: center;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 210, 63, .28) 0 140px, transparent 141px),
        radial-gradient(circle at 88% 82%, rgba(255, 122, 182, .35) 0 170px, transparent 171px),
        linear-gradient(rgba(255, 255, 255, .13) 1.5px, transparent 1.5px) 0 0 / 30px 30px,
        linear-gradient(90deg, rgba(255, 255, 255, .13) 1.5px, transparent 1.5px) 0 0 / 30px 30px,
        #3b6bff;
      color: #fff;
    }
    .left { display: grid; justify-items: center; align-content: center; gap: 8px; padding: 0 0 0 40px; }
    .logo.latin { --fs: 118px; margin: 30px 0 18px; }
    .tagline { margin: 0; font-family: var(--chunky); font-weight: 400; font-size: 34px; text-align: center; color: #fff;
      text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 4px 6px 0 var(--ink); }
    .sub { margin: 0; font-size: 19px; font-weight: 900; text-align: center; color: #fff; text-shadow: 0 2px 0 rgba(27, 29, 77, .6); opacity: .95; }
    .right { position: relative; height: 100%; }
    .right svg { position: absolute; left: 10px; bottom: -14px; width: 360px; height: auto; filter: drop-shadow(0 10px 0 rgba(27, 29, 77, .35)); }
    .logo *, .logo-burst { animation: none !important; }
  </style>
</head>
<body>
  <div class="left">
    <h1 id="logo" class="logo latin" aria-label="CapiFiesta">
      <svg class="logo-burst" viewBox="-100 -100 200 200" aria-hidden="true"><path id="logo-burst-path" fill="#ffd23f" stroke="#1b1d4d" stroke-width="5" stroke-linejoin="round"/><path id="logo-burst-inner" fill="#ff7ab6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/></svg>
      <span class="logo-top" aria-hidden="true"><i data-c="C">C</i><i data-c="A">A</i><i data-c="P">P</i><i data-c="I">I</i></span>
      <span class="logo-ribbon" aria-hidden="true"><svg class="ribbon-bg" viewBox="0 0 300 70" preserveAspectRatio="none"><path d="M4 22 L34 16 L28 36 L40 58 L6 62 L18 42Z" fill="#2a4fd6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/><path d="M296 22 L266 16 L272 36 L260 58 L294 62 L282 42Z" fill="#2a4fd6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/><path d="M30 10 Q150 -4 270 10 L270 56 Q150 42 30 56Z" fill="#3b6bff" stroke="#1b1d4d" stroke-width="4.5" stroke-linejoin="round"/><path d="M42 18 Q150 6 258 18" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" opacity=".7"/></svg><i>F</i><i>I</i><i>E</i><i>S</i><i>T</i><i>A</i></span>
      <span class="logo-bits" aria-hidden="true"><b style="--x:-46%;--y:4%;--r:-18deg;--c:#3fdcb0">＋</b><b style="--x:44%;--y:-2%;--r:14deg;--c:#a77bff">×</b><b style="--x:-34%;--y:104%;--r:10deg;--c:#ff4f6d">÷</b><b style="--x:36%;--y:102%;--r:-12deg;--c:#ffd23f">−</b></span>
    </h1>
    <p class="tagline" id="tagline">Matemáticas con fiesta</p>
    <p class="sub" id="sub">1.º a 6.º de primaria · sin cuentas · funciona sin conexión</p>
  </div>
  <div class="right" id="mascot"></div>
  <script type="module">
    import { mascotSVG } from '../app/js/mascot.js';
    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
    document.documentElement.lang = lang;
    if (lang === 'en') {
      document.getElementById('tagline').textContent = 'Math with a party';
      document.getElementById('sub').textContent = 'Grades 1–6 · no accounts · works offline';
    }
    document.getElementById('mascot').innerHTML = mascotSVG('capi');
    // Same hand-cut star as main.js.
    const star = (R, r, n, jitter, seed) => {
      let d = ''; let s0 = seed;
      const rnd = () => { s0 = (s0 * 9301 + 49297) % 233280; return s0 / 233280; };
      for (let i = 0; i < n * 2; i++) {
        const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
        const rr = (i % 2 ? r : R) * (1 + (rnd() - 0.5) * jitter);
        d += `${i ? 'L' : 'M'}${(Math.cos(a) * rr).toFixed(1)} ${(Math.sin(a) * rr).toFixed(1)}`;
      }
      return `${d}Z`;
    };
    document.getElementById('logo-burst-path').setAttribute('d', star(96, 66, 14, 0.14, 7));
    document.getElementById('logo-burst-inner').setAttribute('d', star(70, 52, 14, 0.1, 3));
    document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
  </script>
</body>
</html>
