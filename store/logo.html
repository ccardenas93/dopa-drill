<!doctype html>
<!-- Logo on a transparent background (rendered with omitBackground). ?lang=ja for the original. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../app/style.css">
  <style>
    html, body { width: 700px; height: 520px; overflow: hidden; background: transparent !important; }
    body { margin: 0; display: grid; place-items: center; }
    .logo { --fs: 118px; margin: 0; }
    .logo.latin { --fs: 118px; }
    .logo *, .logo-burst { animation: none !important; }
  </style>
</head>
<body>
  <h1 id="logo" class="logo latin" aria-label="Dopa Drill">
    <svg class="logo-burst" viewBox="-100 -100 200 200" aria-hidden="true"><path id="logo-burst-path" fill="#ffd23f" stroke="#1b1d4d" stroke-width="5" stroke-linejoin="round"/><path id="logo-burst-inner" fill="#ff7ab6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/></svg>
    <span class="logo-top" aria-hidden="true"></span>
    <span class="logo-ribbon" aria-hidden="true"><svg class="ribbon-bg" viewBox="0 0 300 70" preserveAspectRatio="none"><path d="M4 22 L34 16 L28 36 L40 58 L6 62 L18 42Z" fill="#2a4fd6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/><path d="M296 22 L266 16 L272 36 L260 58 L294 62 L282 42Z" fill="#2a4fd6" stroke="#1b1d4d" stroke-width="4" stroke-linejoin="round"/><path d="M30 10 Q150 -4 270 10 L270 56 Q150 42 30 56Z" fill="#3b6bff" stroke="#1b1d4d" stroke-width="4.5" stroke-linejoin="round"/><path d="M42 18 Q150 6 258 18" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" opacity=".7"/></svg></span>
    <span class="logo-bits" aria-hidden="true"><b style="--x:-46%;--y:4%;--r:-18deg;--c:#3fdcb0">＋</b><b style="--x:44%;--y:-2%;--r:14deg;--c:#a77bff">×</b><b style="--x:-34%;--y:104%;--r:10deg;--c:#ff4f6d">÷</b><b style="--x:36%;--y:102%;--r:-12deg;--c:#ffd23f">−</b></span>
  </h1>
  <script type="module">
    const ja = new URLSearchParams(location.search).get('lang') === 'ja';
    const top = ja ? 'ドパ' : 'DOPA'; const bottom = ja ? 'ドリル' : 'DRILL';
    document.querySelector('.logo-top').innerHTML = [...top].map((c) => `<i data-c="${c}">${c}</i>`).join('');
    document.querySelector('.logo-ribbon').insertAdjacentHTML('beforeend', [...bottom].map((c) => `<i>${c}</i>`).join(''));
    document.getElementById('logo').classList.toggle('latin', !ja);
    const star = (R, r, n, jitter, seed) => {
      let d = ''; let s0 = seed;
      const rnd = () => { s0 = (s0 * 9301 + 49297) % 233280; return s0 / 233280; };
      for (let i = 0; i < n * 2; i++) {
        const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
        const rr = (i % 2 ? r : R) * (1 + (rnd() - 0.5) * jitter);
        d += `${i ? 'L' : 'M'}${(Math.cos(a) * rr).toFixed(1)} ${(Math.sin(a) * rr).toFixed(1)}`;
      }
      return `${d}Z`;
    };
    document.getElementById('logo-burst-path').setAttribute('d', star(96, 66, 14, 0.14, 7));
    document.getElementById('logo-burst-inner').setAttribute('d', star(70, 52, 14, 0.1, 3));
    document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
  </script>
</body>
</html>
