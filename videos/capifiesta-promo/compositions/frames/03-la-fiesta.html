<style>

  @font-face { font-family: "Zen Maru Gothic"; src: url("assets/fonts/zen-maru-gothic-bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }

  /* Frame root — styled via #root only (never a class on the composition element). */
  #root {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    --ink: #1B1D4D;
    --cream: #FFF8EC;
    --white: #FFFFFF;
    --butter: #FFD23F;
    --coral: #FF7AB6;
    --mint: #D9FBEF;
    --sky: #D9E4FF;

    font-family: "Zen Maru Gothic", sans-serif;
    color: var(--ink);
  }

  /* ---- layers (every clip is full-frame, full-duration) ---- */
  .f03-la-fiesta-layer {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
  }

  /* Scene 1 ground: cream paper with the game's thin grid, present from t=0 */
  .f03-la-fiesta-ground {
    background-color: var(--cream);
    background-image:

    background-size: 48px 48px;
    background-position: 12px 12px;
  }

  /* Device bezel drawn AROUND the hoisted video (x 208–872 / y 110–1290).
     Spans x 196–884, y 98–1302; its interior sits under the recording, so only
     the 3px ink outline, the white rim and the 8px hard shadow are visible. */
  .f03-la-fiesta-bezel {
    position: absolute;
    left: 196px;
    top: 98px;
    width: 688px;
    height: 1204px;
    box-sizing: border-box;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: var(--white);
    box-shadow: 8px 8px 0 var(--ink);
    transform-origin: 50% 50%;
    will-change: transform;
  }

  /* Operator scraps (＋ ×) near the top corners, outside the bezel */
  .f03-la-fiesta-scrap {
    position: absolute;
    width: 100px;
    height: 100px;
    box-sizing: border-box;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: var(--white);
    box-shadow: 4px 4px 0 var(--ink);

    align-items: center;
    justify-content: center;
    transform-origin: 50% 50%;
    will-change: transform;

  .f03-la-fiesta-scrap svg { width: 56px; height: 56px; display: block; }
  .f03-la-fiesta-scrap-plus { left: 44px; top: 26px; }
  .f03-la-fiesta-scrap-times { left: 936px; top: 40px; }

  /* Two outlined pastel discs (÷ −) in the side gutters complete the ornament wreath */
  .f03-la-fiesta-disc {
    position: absolute;
    width: 72px;
    height: 72px;
    box-sizing: border-box;
    border: 3px solid var(--ink);
    border-radius: 50%;
    box-shadow: 4px 4px 0 var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .f03-la-fiesta-disc svg { width: 38px; height: 38px; display: block; }
  .f03-la-fiesta-disc-divide { left: 62px; top: 700px; background: var(--lavender); }
  .f03-la-fiesta-disc-minus { left: 948px; top: 980px; background: var(--peach); }

  /* 2×2 chip grid BELOW the bezel — rows y 1330–1400 / 1420–1490, columns centred at x 330 / 750.
     Each cell is a 400px flex box; the chip inside is content-sized (≤ 380px) and centred,
     so the animated element carries no CSS transform of its own. */
  .f03-la-fiesta-cell {
    position: absolute;
    width: 400px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .f03-la-fiesta-cell-1 { left: 130px; top: 1330px; }
  .f03-la-fiesta-cell-2 { left: 550px; top: 1330px; }
  .f03-la-fiesta-cell-3 { left: 130px; top: 1420px; }
  .f03-la-fiesta-cell-4 { left: 550px; top: 1420px; }

  /* jitter wrapper: transform is written by the timeline (sine-wave-loop), never by GSAP */
  .f03-la-fiesta-jitter {
    display: inline-flex;
    will-change: transform;
  }

  /* badge-pill chip */
  .f03-la-fiesta-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 70px;
    padding: 0 30px;
    box-sizing: border-box;
    border: 3px solid var(--ink);
    border-radius: 50px;
    box-shadow: 4px 4px 0 var(--ink);
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 36px;
    line-height: 1;
    letter-spacing: 0.01em;
    white-space: nowrap;
    color: var(--ink);
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .f03-la-fiesta-chip--butter { background: var(--butter); }
  .f03-la-fiesta-chip--coral {
    background: var(--coral);
    color: var(--ink);
  }
  .f03-la-fiesta-chip--mint { background: var(--mint); }
  .f03-la-fiesta-chip--sky { background: var(--sky); }

  /* chip 4: fixed min-width ≥ its widest state so the hard text cut never jitters the pill edge */
  .f03-la-fiesta-chip--swap { min-width: 340px; }
  .f03-la-fiesta-chip--swap.is-done { background: var(--butter); }
  .f03-la-fiesta-check { width: 34px; height: 34px; display: none; }
  .f03-la-fiesta-chip--swap.is-done .f03-la-fiesta-check { display: block; }
</style>

<script>
  (function () {
    window.__timelines = window.__timelines || {};

    var DURATION = 12.8;
    var byId = function (suffix) { return document.getElementById("03-la-fiesta-" + suffix); };

    var bezel = byId("bezel");
    var ornaments = [byId("scrap-plus"), byId("scrap-times"), byId("disc-divide"), byId("disc-minus")];
    var chips = [byId("chip-1"), byId("chip-2"), byId("chip-3"), byId("chip-4")];
    var chip4 = chips[3];
    var chip4Label = byId("chip-4-label");
    var chip4Jitter = byId("chip-4-jitter");

    var tl = gsap.timeline({ paused: true });

    /* ---- Scene 1 (0.0–1.0s): bezel settles 0.92 → 1, long-tail power3; scraps spring-pop in ---- */
    tl.fromTo(bezel, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0); /* the hoisted video is fixed, so the bezel only fades in */

    // spring-pop-entrance (smooth settle, no overshoot) — one arriving beat, 0.2 → 0.64s
    var ornRot = [-10, 8, 0, 0];
    var ornAt = [0.2, 0.34, 0.5, 0.64];
    ornaments.forEach(function (el, i) {
      tl.fromTo(
        el,
        { scale: 0, opacity: 0, rotation: ornRot[i] },
        { scale: 1, opacity: 1, rotation: ornRot[i], duration: 0.5, ease: "power3.out" },
        ornAt[i]
      );
    });

    /* ---- Scene 2 (1.0–5.0s) + Scene 3 (5.3s): chips pop on their spoken cues ---- */
    // "sube la música" 1.0 · "confeti" 2.6 · "Dopakichi" 4.3 · "¿Te equivocas?" 5.3
    var chipAt = [1.0, 2.6, 4.3, 5.3];
    chips.forEach(function (el, i) {
      tl.fromTo(
        el,
        { scale: 0, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        chipAt[i]
      );
    });

    /* ---- Scene 3 (6.2s): discrete-text-sequence — whole-state hard cut, reverse-searched each frame ---- */
    var SEQUENCE = [
      { t: 0.0, text: "¿Te equivocas?", done: false },
      { t: 6.2, text: "Sin game over", done: true }, // "No pasa nada" → fill flips to butter, check draws in
    ];
    function stateAt(time) {
      for (var i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i];
      }
      return SEQUENCE[0];
    }
    var driver = { t: 0 };
    tl.to(
      driver,
      {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          var s = stateAt(driver.t);
          if (chip4Label.textContent !== s.text) chip4Label.textContent = s.text;
          if (chip4.classList.contains("is-done") !== s.done) chip4.classList.toggle("is-done", s.done);
        },
      },
      0
    );
    // state pulse on completion — two chained one-way tweens land the cut
    tl.fromTo(chip4, { scale: 1 }, { scale: 1.07, duration: 0.12, ease: "power2.out", immediateRender: false }, 6.2);
    tl.fromTo(chip4, { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 6.32);

    /* ---- Scene 4 (7.5–12.8s): held read; sine-wave-loop subtle jitter on the "Sin game over" chip only ---- */
    var IDLE_START = 7.5;
    var IDLE_DUR = DURATION - IDLE_START; // 5.3s
    var CYCLES = 2.4; // period ≈ 2.2s
    var FADE_FRAC = 0.2; // settle-and-fade tail so the frame is still at the hand-off
    var phase = { p: 0 };
    tl.to(
      phase,
      {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function () {
          var p = phase.p;
          var u = p / (Math.PI * 2 * CYCLES);
          var env = u < 1 - FADE_FRAC ? 1 : (1 - u) / FADE_FRAC;
          // multi-octave, every term is 0 at p = 0 → no jump off the settled state
          var y = (Math.sin(p) * 2.5 + Math.sin(p * 2.7) * 0.8) * env;
          var x = Math.sin(p * 0.8) * 1.2 * env;
          var rot = Math.sin(p * 1.3) * 0.5 * env;
          chip4Jitter.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) rotate(" + rot.toFixed(2) + "deg)";
        },
      },
      IDLE_START
    );

    window.__timelines["03-la-fiesta"] = tl;
  })();
</script>
