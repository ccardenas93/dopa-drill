<script>
  (function () {
    var ID = "02-dopa-drill";
    var DURATION = 4.6; // fixed upstream from the real voice timing

    var logo = document.getElementById(ID + "-logo");
    var icon = document.getElementById(ID + "-icon");
    var pill = document.getElementById(ID + "-pill");
    var words = Array.prototype.slice.call(pill.querySelectorAll(".f02-w"));

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    /* ---------- Scene 1 (0.0–1.0s) · "CapiFiesta" · logo spring-pop, playful overshoot ---------- */
    var LOGO_AT = 0.05;
    // Stable resting states before the first tween (seek-safe baseline for the repeated fromTo calls).
    gsap.set(logo, { opacity: 0, scale: 0, rotation: -7 });
    gsap.set(icon, { opacity: 0, x: 560, rotation: 17 });
    tl.fromTo(logo, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, LOGO_AT);
    tl.fromTo(
      logo,
      { scale: 0, rotation: -7 },
      { scale: 1, rotation: 0, duration: 0.62, ease: "back.out(1.45)" },
      LOGO_AT
    );

    /* ---------- Scene 2a (0.9s) · "cálculo mental" · icon slides in from the right, long-tail settle ---------- */
    var ICON_AT = 0.9;
    tl.fromTo(icon, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, ICON_AT);
    tl.fromTo(
      icon,
      { x: 560, rotation: 17 },
      { x: 0, rotation: 7, duration: 0.78, ease: "power3.out" },
      ICON_AT
    );

    /* ---------- Scene 2b (1.55–3.3s) · "de primero a sexto de primaria" ---------- */
    // The butter pill lands first (spring-pop-entrance, smooth settle) …
    var PILL_AT = 1.55;
    tl.fromTo(
      pill,
      { scale: 0.55, opacity: 0, y: 26 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      PILL_AT
    );

    // … then each word arrives on a schedule derived from its length
    // (dynamic-content-sequencing: BASE_DURATION + chars × SEC_PER_CHAR, pre-computed once at build).
    var WORDS_AT = 1.7;
    var BASE_DURATION = 0.14;
    var SEC_PER_CHAR = 0.05;
    var cumulative = 0;
    var TIMELINE = words.map(function (el) {
      var text = el.textContent;
      var dur = BASE_DURATION + text.length * SEC_PER_CHAR;
      var start = cumulative;
      cumulative += dur;
      return { el: el, start: start, end: cumulative };
    });
    // schedule → 1.º@1.70 · a@1.99 · 6.º@2.18 · de@2.47 · primaria@2.71 (ends 3.25, voice ends 3.4)
    TIMELINE.forEach(function (entry) {
      tl.fromTo(
        entry.el,
        { opacity: 0, y: 18, scale: 0.6 },
        { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "power3.out" },
        WORDS_AT + entry.start
      );
    });

    /* ---------- Scene 3 (3.4–4.6s) · held lockup — nothing moves; pin the timeline to the frame length ---------- */
    tl.to({ t: 0 }, { t: 1, duration: DURATION, ease: "none" }, 0);

    window.__timelines[ID] = tl;
  })();
</script>
