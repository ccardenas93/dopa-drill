  <div id="root" data-composition-id="06-gratis-google-play" data-width="1080" data-height="1920">
    <!-- Track 0: full-bleed ground -->
    <div id="06-gratis-google-play-bg" class="clip" data-start="0" data-duration="4.7" data-track-index="0"></div>

    <!-- Track 1: stage -->
    <div id="06-gratis-google-play-stage" class="clip" data-start="0" data-duration="4.7" data-track-index="1">

      <!-- Operator scrap ornaments: butter +, coral x, mint /, lavender - (static from t=0) -->
      <svg class="06-gratis-google-play-scrap" style="left:-34px; top:104px;" viewBox="-90 -90 180 180" aria-hidden="true">

          <path fill="#FFD23F" stroke="#1B1D4D" stroke-width="3" stroke-linejoin="round" d="M-17-58H17V-17H58V17H17V58H-17V17H-58V-17H-17Z"/>

            <rect x="-58" y="-15" width="116" height="30" rx="10"/>

          </g>
          <g fill="#D9FBEF" stroke="#1B1D4D" stroke-width="3" stroke-linejoin="round">
            <rect x="-58" y="-15" width="116" height="30" rx="10"/>
            <circle cx="0" cy="-48" r="15"/>
            <circle cx="0" cy="48" r="15"/>

      <svg class="06-gratis-google-play-scrap" style="left:944px; top:1276px;" viewBox="-90 -90 180 180" aria-hidden="true">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "06-gratis-google-play";
      var DURATION = 4.7;
      var byId = function (suffix) { return document.getElementById(ID + "-" + suffix); };

      var icon = byId("icon");
      var logo = byId("logo");
      var card = byId("card");
      var sub = byId("sub");
      var pill = byId("pill");
      var field = byId("field");

      /* ---------- particle-burst: seeded pool, built ONCE at setup ---------- */
      var PARTICLE_COUNT = 26;   // <= 30 per the packet
      var SIZE_MIN = 9, SIZE_MAX = 15;
      var CONE = 0.55;           // rad, upward cone half-angle
      var SPEED_MIN = 380, SPEED_MAX = 640;
      var SPIN_MAX = 540;        // deg/s
      var G = 1400;              // px/s^2
      var FLIGHT_DUR = 1.0;
      var SHRINK_FRAC = 0.2;     // last 20% of flight: instant-shrink to 0
      var BURST_AT = 1.4;        // on the card's settle
      var palette = ["#FFD23F", "#FF7AB6", "#D9FBEF", "#EFE6FF", "#FFFFFF"];

      var prand = function (n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x); // 0..1, pure function of n
      };

      var parts = [];
      for (var i = 0; i < PARTICLE_COUNT; i++) {
        var el = document.createElement("div");
        el.className = ID + "-particle";
        var size = SIZE_MIN + prand(i * 3 + 1) * (SIZE_MAX - SIZE_MIN);
        el.style.width = size + "px";
        el.style.height = (size * 0.7) + "px";
        el.style.background = palette[i % palette.length];
        field.appendChild(el);
        var angle = -Math.PI / 2 + (prand(i * 5 + 2) * 2 - 1) * CONE;
        var speed = SPEED_MIN + prand(i * 7 + 3) * (SPEED_MAX - SPEED_MIN);
        parts.push({
          el: el,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed, // negative = up
          spin: (prand(i * 11 + 4) * 2 - 1) * SPIN_MAX
        });
      }

      var drive = { T: 0 };
      var renderBurst = function () {
        var T = drive.T;
        var t = T * FLIGHT_DUR; // seconds of flight — pure function of T
        var shrinkStart = 1 - SHRINK_FRAC;
        var k = T < shrinkStart ? 1 : 1 - Math.pow((T - shrinkStart) / SHRINK_FRAC, 2); // power2.in to 0
        var visible = T > 0 && T < 1; // hidden before the event and after it
        for (var j = 0; j < parts.length; j++) {
          var p = parts[j];
          var x = p.vx * t;
          var y = p.vy * t + 0.5 * G * t * t; // rise, stall, drift down (behind the card)
          p.el.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (p.spin * t) + "deg) scale(" + k + ")";
          p.el.style.opacity = visible ? "1" : "0";
        }
      };

      /* ---------- the one paused timeline ---------- */
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.0s): on "CapiFiesta" the icon lands — playful spring-pop (overshoot allowed)
      tl.fromTo(icon,
        { scale: 0, opacity: 0, rotation: -8 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.7)" },
        0.05);
      // ...and the logo pops beneath it with the same move a beat later
      tl.fromTo(logo,
        { scale: 0, opacity: 0, rotation: 5 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.65, ease: "back.out(1.5)" },
        0.42);

      // Scene 2 (1.0–2.4s): on "Gratis en Google Play" the white card pops — smooth settle
      tl.fromTo(card,
        { scale: 0, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.9);
      // "en Google Play" lands as the voice reaches it
      tl.fromTo(sub,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.2);
      // confetti punctuates the card's arrival: one driver, ballistic formula, ease "none"
      tl.fromTo(drive,
        { T: 0 },
        { T: 1, duration: FLIGHT_DUR, ease: "none", onUpdate: renderBurst },
        BURST_AT);

      // Scene 3 (2.4–4.7s): the badge-pill settles under the card, then everything holds still
      tl.fromTo(pill,
        { scale: 0, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.4);

      // Final frame: hold the lockup to the end — no exit
      tl.to({}, { duration: DURATION - 2.9 }, 2.9);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
