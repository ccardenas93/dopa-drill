  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) { return document.getElementById(id); };

      var scrapA  = byId("04-el-arbol-scrap-a");
      var scrapB  = byId("04-el-arbol-scrap-b");
      var card    = byId("04-el-arbol-card");
      var counter = byId("04-el-arbol-counter");
      var label   = byId("04-el-arbol-label");
      var chips   = [1, 2, 3, 4].map(function (n) { return byId("04-el-arbol-chip-" + n); });
      var badge   = byId("04-el-arbol-badge");

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0–1.3s): tree ground + scraps; card pops on "Cincuenta y ocho" ---- */
      tl.fromTo(scrapA,
        { scale: 0, opacity: 0, rotation: -26 },
        { scale: 1, opacity: 1, rotation: -12, duration: 0.5, ease: "power3.out" }, 0.04);
      tl.fromTo(scrapB,
        { scale: 0, opacity: 0, rotation: 22 },
        { scale: 1, opacity: 1, rotation: 9, duration: 0.5, ease: "power3.out" }, 0.10);

      // spring-pop-entrance (firm settle, no overshoot) — hero visible well before 0.5s
      tl.fromTo(card,
        { scale: 0, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.08);

      // counting-dynamic-scale: two synchronized tweens at the SAME position with the SAME ease —
      // (1) a proxy value rendered as text in onUpdate (text only, O(1), Math.round),
      // (2) the counter's transform scale START_SCALE → 1 (START_SCALE = START_SIZE / END_SIZE ≈ 50%).
      // Grow in place, never bounce; font-size stays static CSS.
      var COUNT_AT = 0.12, COUNT_DUR = 1.2, COUNT_EASE = "power3.out", START_SCALE = 0.5;
      var count = { value: 0 };
      tl.to(count, {
        value: 58,
        duration: COUNT_DUR,
        ease: COUNT_EASE,
        onUpdate: function () { counter.textContent = String(Math.round(count.value)); }
      }, COUNT_AT);
      tl.fromTo(counter,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      // label arrives before the count peaks, as the VO says "habilidades"
      tl.fromTo(label,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.75);

      /* ---- Scene 2 (1.3–3.6s): "de sumas a porcentajes" — chips stack one at a time ---- */
      var CHIP_AT = [1.45, 1.85, 2.25, 2.65];
      chips.forEach(function (el, i) {
        tl.fromTo(el,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CHIP_AT[i]);
      });

      /* ---- Scene 3 (3.6–5.9s): "a tu ritmo" badge pops beside the last chip at ~4.3s, then hold ---- */
      tl.fromTo(badge,
        { scale: 0, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: -6, duration: 0.55, ease: "back.out(1.5)" }, 4.3);

      // pin the timeline to the frame's fixed 5.9s — everything holds still after the voice ends
      tl.to({}, { duration: 0.01 }, 5.89);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-el-arbol"] = tl;
    })();
  </script>
