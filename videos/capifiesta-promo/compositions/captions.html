<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE picture-book card — cream surface, 3px charcoal outline, generous 24px radius,
     a hard 6px charcoal offset shadow (no blur): the sticker-on-paper signature */
  .caption-pill {
    max-width: 80%;
    padding: 18px 40px 22px;
    background: var(--cap-canvas, #f5f0e6);
    border: 3px solid var(--cap-ink, #2d2d2d);
    border-radius: 24px;
    box-shadow: 6px 6px 0 var(--cap-ink, #2d2d2d);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.18em 0.32em;
    font-family: "Dela Gothic One", sans-serif;
    font-weight: 600;
    font-size: clamp(38px, 4.2vw, 56px);
    line-height: 1.22;
    letter-spacing: 0.02em;
  }

  /* upcoming — muted charcoal, no candy block */
  .caption-word {
    display: inline-block;
    padding: 0.02em 0.16em;
    border-radius: 12px;
    color: color-mix(in srgb, var(--cap-ink, #2d2d2d) 52%, var(--cap-canvas, #f5f0e6));
  }
  /* current word — THE sunny-pastel candy block: a rounded coral chip with a 3px
     charcoal outline + a hard 3px charcoal offset shadow (no blur), charcoal on top */
  .caption-word.is-active {
    color: var(--cap-ink, #2d2d2d);
    background: var(--cap-accent, #f8635f);
    border-radius: 12px;
    box-shadow:
      0 0 0 3px var(--cap-ink, #2d2d2d),
      3px 5px 0 0 var(--cap-ink, #2d2d2d);
  }
  /* already spoken — solid charcoal, candy block cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #2d2d2d);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — a butter candy chip, the cheerful second pastel */
  .caption-word.cap-brand {
    color: var(--cap-ink, #2d2d2d);
    background: var(--cap-accent-2, #fde68a);
    border-radius: 12px;
    box-shadow: 0 0 0 3px var(--cap-ink, #2d2d2d);
  }
  /* numerals / data — Quicksand, slightly recessed */
  .caption-word.cap-num {
    font-family: "Zen Maru Gothic", system-ui, sans-serif;
    font-weight: 700;
    color: color-mix(in srgb, var(--cap-ink, #2d2d2d) 78%, var(--cap-canvas, #f5f0e6));
  }
  /* emphasis — a butter underline rule (the second sunny pastel) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-decoration-color: var(--cap-accent-2, #fde68a);
    text-underline-offset: 0.12em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(32px, 5.2vw, 46px);
    }
  }
</style>
