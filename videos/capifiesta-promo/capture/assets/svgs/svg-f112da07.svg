<svg xmlns="http://www.w3.org/2000/svg" id="actors" aria-hidden="true"><g id="actors-back"></g><g id="actors-front"></g><style id="dk-style">.dk-l,.dk-f,.dk-t{stroke:#000;stroke-linecap:round;stroke-linejoin:round}.dk-l{stroke-width:var(--dkw)}.dk-f{stroke-width:calc(var(--dkw) * 1.5)}.dk-t{stroke-width:calc(var(--dkw) * 0.55)}</style><defs><linearGradient id="dk-rainbow" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff97bf"></stop><stop offset=".33" stop-color="#ffd452"></stop><stop offset=".66" stop-color="#5eddb8"></stop><stop offset="1" stop-color="#8fb4ff"></stop></linearGradient></defs></svg>